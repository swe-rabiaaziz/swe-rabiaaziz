<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="326" viewBox="0 0 1000 326" role="img" aria-label="What I do: production MVPs, Figma to Flutter, AI and voice integration, backend and cloud architecture, code audits and refactoring">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
  </defs>
  <style>
    .idx{font:500 12px 'JetBrains Mono','SFMono-Regular',Consolas,monospace;letter-spacing:2px;fill:#52525b}
    .ttl{font:700 19px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fafafa;letter-spacing:-0.3px}
    .dsc{font:400 13px Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#a1a1aa}
  </style>

  <!-- 01 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    <rect x="0.75" y="0.75" width="314.5" height="148.5" rx="16" fill="url(#card)" stroke="#27272a"/>
    <rect x="0.75" y="0.75" width="314.5" height="148.5" rx="16" fill="none" stroke="#fafafa" stroke-opacity="0.75" stroke-width="1.5" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text class="idx" x="24" y="34">01</text>
    <text class="ttl" x="24" y="68">Production MVPs</text>
    <text class="dsc" x="24" y="95">From idea and wireframe to</text>
    <text class="dsc" x="24" y="114">App Store and Google Play.</text>
    <rect x="24" y="129" width="24" height="2" rx="1" fill="#fafafa"><animate attributeName="width" values="24;84;24" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
  </g>

  <!-- 02 -->
  <g transform="translate(342 0)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.15s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      <rect x="0.75" y="0.75" width="314.5" height="148.5" rx="16" fill="url(#card)" stroke="#27272a"/>
      <rect x="0.75" y="0.75" width="314.5" height="148.5" rx="16" fill="none" stroke="#fafafa" stroke-opacity="0.75" stroke-width="1.5" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text class="idx" x="24" y="34">02</text>
      <text class="ttl" x="24" y="68">Figma → Flutter</text>
      <text class="dsc" x="24" y="95">Pixel-perfect screens that</text>
      <text class="dsc" x="24" y="114">stay smooth at 60/120fps.</text>
      <rect x="24" y="129" width="24" height="2" rx="1" fill="#fafafa"><animate attributeName="width" values="24;84;24" dur="3.6s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
    </g>
  </g>

  <!-- 03 -->
  <g transform="translate(684 0)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.3s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      <rect x="0.75" y="0.75" width="314.5" height="148.5" rx="16" fill="url(#card)" stroke="#27272a"/>
      <rect x="0.75" y="0.75" width="314.5" height="148.5" rx="16" fill="none" stroke="#fafafa" stroke-opacity="0.75" stroke-width="1.5" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="6s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <text class="idx" x="24" y="34">03</text>
      <text class="ttl" x="24" y="68">AI &amp; Voice Integration</text>
      <text class="dsc" x="24" y="95">Speech-to-Text, AI mock interviews</text>
      <text class="dsc" x="24" y="114">and streaming LLM APIs.</text>
      <rect x="24" y="129" width="24" height="2" rx="1" fill="#fafafa"><animate attributeName="width" values="24;84;24" dur="3.6s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
    </g>
  </g>

  <!-- 04 -->
  <g transform="translate(0 176)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.45s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      <rect x="0.75" y="0.75" width="485.5" height="148.5" rx="16" fill="url(#card)" stroke="#27272a"/>
      <rect x="0.75" y="0.75" width="485.5" height="148.5" rx="16" fill="none" stroke="#fafafa" stroke-opacity="0.75" stroke-width="1.5" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" begin="3.6s" repeatCount="indefinite"/>
      </rect>
      <text class="idx" x="24" y="34">04</text>
      <text class="ttl" x="24" y="68">Backend &amp; Cloud Architecture</text>
      <text class="dsc" x="24" y="95">Supabase (Auth, PostgreSQL) and Firebase,</text>
      <text class="dsc" x="24" y="114">wired into clean, scalable architecture.</text>
      <rect x="24" y="129" width="24" height="2" rx="1" fill="#fafafa"><animate attributeName="width" values="24;84;24" dur="3.6s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
    </g>
  </g>

  <!-- 05 -->
  <g transform="translate(513 176)">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.6s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
      <rect x="0.75" y="0.75" width="485.5" height="148.5" rx="16" fill="url(#card)" stroke="#27272a"/>
      <rect x="0.75" y="0.75" width="485.5" height="148.5" rx="16" fill="none" stroke="#fafafa" stroke-opacity="0.75" stroke-width="1.5" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" begin="4.8s" repeatCount="indefinite"/>
      </rect>
      <text class="idx" x="24" y="34">05</text>
      <text class="ttl" x="24" y="68">Code Audits &amp; Refactoring</text>
      <text class="dsc" x="24" y="95">Fixing UI jank, memory leaks and</text>
      <text class="dsc" x="24" y="114">tangled state, without a full rewrite.</text>
      <rect x="24" y="129" width="24" height="2" rx="1" fill="#fafafa"><animate attributeName="width" values="24;84;24" dur="3.6s" begin="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
    </g>
  </g>
</svg>
