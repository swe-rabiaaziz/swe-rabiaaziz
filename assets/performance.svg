<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Performance standard: 120 FPS gauge, frame budget, Impeller, RepaintBoundary and Dart isolates">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52525b"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="budgetZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="chartClip"><rect x="32" y="64" width="420" height="154"/></clipPath>
    <g id="barsGroup">
      <rect x="0" y="154" width="10" height="60" rx="2"/>
      <rect x="16" y="130" width="10" height="84" rx="2"/>
      <rect x="32" y="166" width="10" height="48" rx="2"/>
      <rect x="48" y="142" width="10" height="72" rx="2"/>
      <rect x="64" y="118" width="10" height="96" rx="2"/>
      <rect x="80" y="160" width="10" height="54" rx="2"/>
      <rect x="96" y="136" width="10" height="78" rx="2"/>
      <rect x="112" y="172" width="10" height="42" rx="2"/>
      <rect x="128" y="124" width="10" height="90" rx="2"/>
      <rect x="144" y="148" width="10" height="66" rx="2"/>
      <rect x="160" y="106" width="10" height="108" rx="2"/>
      <rect x="176" y="163" width="10" height="51" rx="2"/>
      <rect x="192" y="139" width="10" height="75" rx="2"/>
      <rect x="208" y="151" width="10" height="63" rx="2"/>
      <rect x="224" y="115" width="10" height="99" rx="2"/>
      <rect x="240" y="157" width="10" height="57" rx="2"/>
      <rect x="256" y="133" width="10" height="81" rx="2"/>
      <rect x="272" y="169" width="10" height="45" rx="2"/>
      <rect x="288" y="121" width="10" height="93" rx="2"/>
      <rect x="304" y="145" width="10" height="69" rx="2"/>
      <rect x="320" y="127" width="10" height="87" rx="2"/>
      <rect x="336" y="166" width="10" height="48" rx="2"/>
      <rect x="352" y="112" width="10" height="102" rx="2"/>
      <rect x="368" y="154" width="10" height="60" rx="2"/>
      <rect x="384" y="136" width="10" height="78" rx="2"/>
    </g>
  </defs>

  <rect x="0.75" y="0.75" width="998.5" height="268.5" rx="20" fill="#0a0a0a" stroke="#262626" stroke-width="1.5"/>

  <!-- ================= LEFT: FRAME TIME CHART ================= -->
  <text x="32" y="42" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#737373">FRAME TIME</text>
  <text x="452" y="82" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1.5" fill="#fafafa">8.33ms</text>

  <!-- budget zone shading -->
  <rect x="32" y="64" width="420" height="26" fill="url(#budgetZone)"/>

  <g clip-path="url(#chartClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="7s" repeatCount="indefinite"/>
      <g transform="translate(32 0)" fill="url(#barGrad)" fill-opacity="0.85">
        <use href="#barsGroup" x="0"/>
        <use href="#barsGroup" x="400"/>
        <use href="#barsGroup" x="800"/>
      </g>
    </g>
  </g>
  <line x1="32" y1="214.5" x2="452" y2="214.5" stroke="#404040"/>
  <line x1="32" y1="90" x2="452" y2="90" stroke="#fafafa" stroke-opacity="0.75" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- status pill -->
  <g transform="translate(32 232)">
    <rect width="150" height="22" rx="11" fill="#111111" stroke="#262626"/>
    <circle cx="14" cy="11" r="3.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="14.5" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1.2" fill="#d4d4d8">0 DROPPED FRAMES</text>
  </g>

  <!-- Vertical divider -->
  <line x1="488" y1="28" x2="488" y2="242" stroke="#262626"/>

  <!-- ================= RIGHT: GAUGE ================= -->
  <g>
    <circle cx="593" cy="140" r="82" fill="url(#glow)"/>

    <!-- ticks -->
    <g stroke="#52525b" stroke-width="1.5" stroke-linecap="round">
      <line x1="593" y1="67" x2="593" y2="72" transform="rotate(-90 593 140)"/>
      <line x1="593" y1="67" x2="593" y2="72" transform="rotate(-60 593 140)"/>
      <line x1="593" y1="67" x2="593" y2="72" transform="rotate(-30 593 140)"/>
      <line x1="593" y1="67" x2="593" y2="72" transform="rotate(0 593 140)" stroke="#fafafa"/>
      <line x1="593" y1="67" x2="593" y2="72" transform="rotate(30 593 140)"/>
      <line x1="593" y1="67" x2="593" y2="72" transform="rotate(60 593 140)"/>
      <line x1="593" y1="67" x2="593" y2="72" transform="rotate(90 593 140)"/>
    </g>
    <text x="593" y="60" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing="1" fill="#737373">60</text>

    <!-- arc track -->
    <path d="M533 140A60 60 0 0 1 653 140" fill="none" stroke="#1c1c1c" stroke-width="10" stroke-linecap="round"/>
    <!-- arc fill -->
    <path d="M533 140A60 60 0 0 1 653 140" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100">
      <animate attributeName="stroke-dasharray" values="0 100;100 100;100 100" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- needle -->
    <g>
      <line x1="593" y1="140" x2="593" y2="94" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="-90 593 140;84 593 140;76 593 140;84 593 140;84 593 140" keyTimes="0;0.3;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <circle cx="593" cy="140" r="6" fill="#fafafa"/>
    <circle cx="593" cy="140" r="2.5" fill="#0a0a0a"/>

    <!-- number -->
    <text x="593" y="182" text-anchor="middle" font-family="'Inter',sans-serif" font-size="36" font-weight="900" fill="#fafafa">120
      <animate attributeName="opacity" values="1;0.65;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="593" y="199" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" letter-spacing="4" fill="#737373">FPS</text>
  </g>

  <!-- ================= RIGHT: 2x2 TILES ================= -->

  <!-- Tile A: Frame Budget -->
  <g transform="translate(690 30)">
    <rect width="134" height="100" rx="12" fill="#101010" stroke="#262626"/>
    <g transform="translate(67 31)">
      <circle r="20" fill="none" stroke="#1f1f1f" stroke-width="4"/>
      <circle r="20" fill="none" stroke="#fafafa" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90)">
        <animate attributeName="stroke-dasharray" values="0 100;100 100;100 100" keyTimes="0;0.6;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text y="3.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" fill="#fafafa">8.33</text>
    </g>
    <text x="67" y="76" text-anchor="middle" font-family="'Inter',sans-serif" font-size="11.5" font-weight="700" fill="#fafafa">Frame Budget</text>
    <text x="67" y="90" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing="1" fill="#737373">60 · 120 FPS</text>
  </g>

  <!-- Tile B: Impeller -->
  <g transform="translate(834 30)">
    <rect width="134" height="100" rx="12" fill="#101010" stroke="#262626"/>
    <g transform="translate(67 31)">
      <g stroke="#737373" stroke-width="1.5" stroke-linecap="round">
        <line x1="-8" y1="-22" x2="-8" y2="-15"/><line x1="0" y1="-22" x2="0" y2="-15"/><line x1="8" y1="-22" x2="8" y2="-15"/>
        <line x1="-8" y1="15" x2="-8" y2="22"/><line x1="0" y1="15" x2="0" y2="22"/><line x1="8" y1="15" x2="8" y2="22"/>
        <line x1="-22" y1="-8" x2="-15" y2="-8"/><line x1="-22" y1="0" x2="-15" y2="0"/><line x1="-22" y1="8" x2="-15" y2="8"/>
        <line x1="15" y1="-8" x2="22" y2="-8"/><line x1="15" y1="0" x2="22" y2="0"/><line x1="15" y1="8" x2="22" y2="8"/>
      </g>
      <rect x="-15" y="-15" width="30" height="30" rx="6" fill="#171717" stroke="#fafafa" stroke-width="1.5"/>
      <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#fafafa">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="67" y="76" text-anchor="middle" font-family="'Inter',sans-serif" font-size="11.5" font-weight="700" fill="#fafafa">Impeller GPU</text>
    <text x="67" y="90" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing="1" fill="#737373">ZERO SHADER JANK</text>
  </g>

  <!-- Tile C: RepaintBoundary -->
  <g transform="translate(690 140)">
    <rect width="134" height="100" rx="12" fill="#101010" stroke="#262626"/>
    <g transform="translate(67 8)">
      <g stroke="#3f3f46" stroke-width="1.3">
        <line x1="0" y1="8" x2="-28" y2="30"/>
        <line x1="0" y1="8" x2="0" y2="30"/>
        <line x1="0" y1="8" x2="28" y2="30"/>
      </g>
      <circle cx="0" cy="8" r="5" fill="#fafafa"/>
      <circle cx="-28" cy="34" r="5" fill="#27272a" stroke="#52525b"/>
      <circle cx="28" cy="34" r="5" fill="#27272a" stroke="#52525b"/>
      <!-- isolated boundary -->
      <rect x="-12" y="22" width="24" height="24" rx="6" fill="none" stroke="#fafafa" stroke-width="1.2" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="0" cy="34" r="5" fill="#fafafa"/>
      <circle cx="0" cy="34" r="5" fill="none" stroke="#fafafa" stroke-width="1">
        <animate attributeName="r" values="5;11;5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="67" y="76" text-anchor="middle" font-family="'Inter',sans-serif" font-size="11.5" font-weight="700" fill="#fafafa">RepaintBoundary</text>
    <text x="67" y="90" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing="1" fill="#737373">NO FULL REDRAWS</text>
  </g>

  <!-- Tile D: Isolates -->
  <g transform="translate(834 140)">
    <rect width="134" height="100" rx="12" fill="#101010" stroke="#262626"/>
    <g transform="translate(18 0)">
      <!-- UI lane -->
      <text x="0" y="23" font-family="'JetBrains Mono',monospace" font-size="7" letter-spacing="1" fill="#737373">UI</text>
      <line x1="20" y1="20" x2="98" y2="20" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
      <circle cy="20" r="4" fill="#fafafa">
        <animate attributeName="cx" values="20;98;20" dur="3s" repeatCount="indefinite"/>
      </circle>
      <!-- Isolate lane -->
      <text x="0" y="50" font-family="'JetBrains Mono',monospace" font-size="7" letter-spacing="1" fill="#737373">ISO</text>
      <line x1="20" y1="47" x2="98" y2="47" stroke="#27272a" stroke-width="2" stroke-linecap="round"/>
      <circle cy="47" r="3" fill="#a1a1aa">
        <animate attributeName="cx" values="20;98" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cy="47" r="3" fill="#a1a1aa">
        <animate attributeName="cx" values="20;98" dur="1.6s" begin="-0.53s" repeatCount="indefinite"/>
      </circle>
      <circle cy="47" r="3" fill="#a1a1aa">
        <animate attributeName="cx" values="20;98" dur="1.6s" begin="-1.06s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="67" y="76" text-anchor="middle" font-family="'Inter',sans-serif" font-size="11.5" font-weight="700" fill="#fafafa">Dart Isolates</text>
    <text x="67" y="90" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing="1" fill="#737373">OFF THE UI THREAD</text>
  </g>
</svg>
