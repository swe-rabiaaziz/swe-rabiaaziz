<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Performance standard: 60 and 120 fps frame budget, Impeller testing, widget rebuild optimisation">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#52525b"/>
    </linearGradient>
    <clipPath id="chart"><rect x="32" y="64" width="420" height="162"/></clipPath>
    <g id="bars">
      <rect x="0" y="154" width="10" height="66" rx="2"/>
      <rect x="16" y="130" width="10" height="90" rx="2"/>
      <rect x="32" y="166" width="10" height="54" rx="2"/>
      <rect x="48" y="142" width="10" height="78" rx="2"/>
      <rect x="64" y="118" width="10" height="102" rx="2"/>
      <rect x="80" y="160" width="10" height="60" rx="2"/>
      <rect x="96" y="136" width="10" height="84" rx="2"/>
      <rect x="112" y="172" width="10" height="48" rx="2"/>
      <rect x="128" y="124" width="10" height="96" rx="2"/>
      <rect x="144" y="148" width="10" height="72" rx="2"/>
      <rect x="160" y="106" width="10" height="114" rx="2"/>
      <rect x="176" y="163" width="10" height="57" rx="2"/>
      <rect x="192" y="139" width="10" height="81" rx="2"/>
      <rect x="208" y="151" width="10" height="69" rx="2"/>
      <rect x="224" y="115" width="10" height="105" rx="2"/>
      <rect x="240" y="157" width="10" height="63" rx="2"/>
      <rect x="256" y="133" width="10" height="87" rx="2"/>
      <rect x="272" y="169" width="10" height="51" rx="2"/>
      <rect x="288" y="121" width="10" height="99" rx="2"/>
      <rect x="304" y="145" width="10" height="75" rx="2"/>
      <rect x="320" y="127" width="10" height="93" rx="2"/>
      <rect x="336" y="166" width="10" height="54" rx="2"/>
      <rect x="352" y="112" width="10" height="108" rx="2"/>
      <rect x="368" y="154" width="10" height="66" rx="2"/>
      <rect x="384" y="136" width="10" height="84" rx="2"/>
    </g>
  </defs>

  <rect x="0.75" y="0.75" width="998.5" height="268.5" rx="20" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>

  <!-- left: frame time chart -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="2" fill="#71717a">
    <text x="32" y="40">FRAME TIME</text>
  </g>
  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#71717a">
    <text x="452" y="84" text-anchor="end">FRAME BUDGET</text>
  </g>

  <g clip-path="url(#chart)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="7s" repeatCount="indefinite"/>
      <g transform="translate(32 0)" fill="url(#bar)" fill-opacity="0.9">
        <use href="#bars" x="0"/>
        <use href="#bars" x="400"/>
        <use href="#bars" x="800"/>
      </g>
    </g>
  </g>
  <line x1="32" y1="220.5" x2="452" y2="220.5" stroke="#3f3f46"/>
  <line x1="32" y1="90" x2="452" y2="90" stroke="#fafafa" stroke-opacity="0.55" stroke-dasharray="4 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <g>
    <circle cx="36" cy="247" r="3" fill="#fafafa">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="251" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#71717a">STAYING UNDER THE LINE</text>
  </g>

  <line x1="490.5" y1="32" x2="490.5" y2="238" stroke="#27272a"/>

  <!-- right: standard -->
  <text x="520" y="40" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="2" fill="#71717a">THE PERFORMANCE STANDARD</text>
  <g text-anchor="end">
    <text x="968" y="50" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#fafafa">120<tspan font-size="12" font-weight="600" fill="#71717a" letter-spacing="2"> FPS</tspan>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(520 92)" opacity="0" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="508 92" to="520 92" begin="0.4s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    <circle cx="12" cy="-5" r="10" fill="none" stroke="#fafafa" stroke-width="1.5"/>
    <path d="M7.5 -5 l3.2 3.2 l6 -6.4" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="0" font-size="16" font-weight="600" fill="#fafafa">60 / 120 fps frame-budget targeting</text>
    <text x="38" y="19" font-size="12" fill="#71717a">Every screen designed to stay inside the budget</text>
  </g>
  <g transform="translate(520 138)" opacity="0" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="508 138" to="520 138" begin="0.9s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    <circle cx="12" cy="-5" r="10" fill="none" stroke="#fafafa" stroke-width="1.5"/>
    <path d="M7.5 -5 l3.2 3.2 l6 -6.4" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="0" font-size="16" font-weight="600" fill="#fafafa">Impeller engine testing</text>
    <text x="38" y="19" font-size="12" fill="#71717a">Rendering verified on Flutter's modern engine</text>
  </g>
  <g transform="translate(520 184)" opacity="0" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="508 184" to="520 184" begin="1.4s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    <circle cx="12" cy="-5" r="10" fill="none" stroke="#fafafa" stroke-width="1.5"/>
    <path d="M7.5 -5 l3.2 3.2 l6 -6.4" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="0" font-size="16" font-weight="600" fill="#fafafa">Widget rebuild optimisation</text>
    <text x="38" y="19" font-size="12" fill="#71717a">Right-sized rebuilds, never whole-tree redraws</text>
  </g>
  <g transform="translate(520 230)" opacity="0" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="508 230" to="520 230" begin="1.9s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    <circle cx="12" cy="-5" r="10" fill="none" stroke="#fafafa" stroke-width="1.5"/>
    <path d="M7.5 -5 l3.2 3.2 l6 -6.4" fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="0" font-size="16" font-weight="600" fill="#fafafa">Const-first widgets, scoped state</text>
    <text x="38" y="19" font-size="12" fill="#71717a">Isolated state keeps every UI update surgical</text>
  </g>
</svg>
