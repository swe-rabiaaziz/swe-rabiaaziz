</g>

<!-- stagger -->
<g transform="translate(720 276)">
  <rect width="66" height="50" rx="10" fill="#131313" stroke="#262626"/>
  <rect x="14" y="10" width="38" height="6" rx="3" fill="#d4d4d8" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="-26 0;0 0;0 0" keyTimes="0;.3;1" calcMode="spline" keySplines=".2 .8 .3 1;0 0 1 1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.85;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="20" width="28" height="6" rx="3" fill="#a1a1aa" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="-26 0;0 0;0 0" keyTimes="0;.3;1" calcMode="spline" keySplines=".2 .8 .3 1;0 0 1 1" dur="2.6s" begin="0.18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.85;1" dur="2.6s" begin="0.18s" repeatCount="indefinite"/>
  </rect>
  <rect x="14" y="30" width="34" height="6" rx="3" fill="#71717a" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="-26 0;0 0;0 0" keyTimes="0;.3;1" calcMode="spline" keySplines=".2 .8 .3 1;0 0 1 1" dur="2.6s" begin="0.36s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.85;1" dur="2.6s" begin="0.36s" repeatCount="indefinite"/>
  </rect>
  <text class="cap" x="33" y="44">STAGGER</text>
</g>

<!-- morph -->
<g transform="translate(646 334)">
  <rect width="66" height="50" rx="10" fill="#131313" stroke="#262626"/>
  <g transform="translate(33 20)">
    <rect x="-11" y="-11" width="22" height="22" rx="11" fill="#e5e5e5">
      <animate attributeName="rx" values="11;3;11" keyTimes="0;.5;1" calcMode="spline" keySplines=".5 0 .5 1;.5 0 .5 1" dur="2.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;90" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text class="cap" x="33" y="44">MORPH</text>
</g>

<!-- gesture -->
<g transform="translate(720 334)">
  <rect width="66" height="50" rx="10" fill="#131313" stroke="#262626"/>
  <g transform="translate(33 20)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-12 0;12 0;12 0;-12 0" keyTimes="0;.45;.75;1" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" dur="2.8s" repeatCount="indefinite"/>
      <rect x="-11" y="-8" width="22" height="16" rx="4" fill="#171717" stroke="#d4d4d8" stroke-width="1.2">
        <animateTransform attributeName="transform" type="rotate" values="-8;8;8;-8" keyTimes="0;.45;.75;1" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="0" cy="7" r="3.2" fill="#fff" opacity=".9"/>
      <circle cx="0" cy="7" r="3.2" fill="none" stroke="#fff" stroke-width="1">
        <animate attributeName="r" values="3.2;9" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <text class="cap" x="33" y="44">GESTURE</text>
</g>

