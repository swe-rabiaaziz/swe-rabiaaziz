<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="Four engineering principles: feature-first architecture, Impeller at 120 FPS, fluid motion &amp; animations, and streaming multi-modal AI.">
<defs>
<clipPath id="cl"><rect width="1200" height="420" rx="26"/></clipPath>
<clipPath id="scc"><rect x="488" y="96" width="664" height="90"/></clipPath>
<radialGradient id="bg" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#1a1a1a"/><stop offset=".6" stop-color="#0c0c0c"/><stop offset="1" stop-color="#070707"/></radialGradient>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e0e0e"/><stop offset="1" stop-color="#0e0e0e" stop-opacity="0"/></linearGradient>
<radialGradient id="bt" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#303030"/><stop offset="1" stop-color="#111"/></radialGradient>
<filter id="gl" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.5" result="a"/><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.ti{font:600 19px Georgia,'Times New Roman',serif;fill:#fafafa}
.lt{font:600 15px Georgia,'Times New Roman',serif;fill:#ededed}
.sb{font:400 12px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#8a8a8a}
.mn{font:500 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#777}
.ck{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e5e5e5;text-anchor:middle}
.cap{font:500 7px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6b6b6b;letter-spacing:1.2px;text-anchor:middle}
.big{font:600 34px Georgia,'Times New Roman',serif;fill:#fff;text-anchor:end}
.tf{animation:lit 6s ease-in-out infinite both}
.pd{opacity:0;animation:pd 6s cubic-bezier(.65,0,.3,1) infinite both}
.scroll{animation:sc 5s linear infinite}
.btn{animation:btn 5s linear infinite}
.tok{opacity:0;animation:tok 7s ease-out infinite both}
.bl{animation:bl 1s steps(1) infinite}
.wv{stroke:#d4d4d8;stroke-width:2;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:wv .9s ease-in-out infinite alternate}
@keyframes lit{0%{fill:#151515;stroke:#3a3a3a}4%,20%{fill:#2e2e2e;stroke:#fff}38%,100%{fill:#151515;stroke:#3a3a3a}}
@keyframes pd{0%{opacity:0;transform:translate(170px,200px)}3%{opacity:1}8%{transform:translate(170px,200px)}25%,33%{transform:translate(170px,264px)}50%,58%{transform:translate(170px,328px)}66%,100%{opacity:0;transform:translate(170px,328px)}}
@keyframes sc{to{transform:translateX(-300px)}}
@keyframes btn{0%{transform:scale(0.820)}1%{transform:scale(0.880)}2%{transform:scale(0.950)}3%{transform:scale(1.007)}4%{transform:scale(1.039)}5%{transform:scale(1.048)}6%{transform:scale(1.040)}7%{transform:scale(1.024)}8%{transform:scale(1.007)}9%{transform:scale(0.996)}10%{transform:scale(0.990)}11%{transform:scale(0.989)}12%{transform:scale(0.991)}13%{transform:scale(0.995)}14%{transform:scale(0.999)}15%{transform:scale(1.002)}16%{transform:scale(1.003)}17%{transform:scale(1.003)}18%{transform:scale(1.002)}19%{transform:scale(1.001)}20%{transform:scale(1.000)}21%{transform:scale(1.000)}22%{transform:scale(0.999)}23%{transform:scale(0.999)}24%{transform:scale(1.000)}84%{transform:scale(1)}100%{transform:scale(.82)}}
@keyframes tok{0%{opacity:0;transform:translateY(5px)}3%{opacity:1;transform:none}90%{opacity:1}96%,100%{opacity:0}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes wv{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tok{opacity:1}}
</style>
<g clip-path="url(#cl)">
<rect width="1200" height="420" fill="url(#bg)"/>
<rect x="24" y="24" width="420" height="372" rx="18" fill="#0e0e0e" stroke="#262626"/><rect x="64" y="24" width="340" height="1" fill="url(#hl)"/><rect x="464" y="24" width="712" height="168" rx="18" fill="#0e0e0e" stroke="#262626"/><rect x="504" y="24" width="632" height="1" fill="url(#hl)"/><rect x="464" y="208" width="346" height="188" rx="18" fill="#0e0e0e" stroke="#262626"/><rect x="504" y="208" width="266" height="1" fill="url(#hl)"/><rect x="830" y="208" width="346" height="188" rx="18" fill="#0e0e0e" stroke="#262626"/><rect x="870" y="208" width="266" height="1" fill="url(#hl)"/>

<!-- architecture -->
<text class="ti" x="48" y="62">Feature-first architecture</text>
<text class="sb" x="48" y="84">Every feature is a deletable module.</text>
<text class="sb" x="48" y="101">Strict layers, type-safe SQL with Drift.</text>
<g transform="translate(170 328)"><polygon points="-92,0 0,46 0,58 -92,12" fill="#0b0b0b" stroke="#2a2a2a"/><polygon points="0,46 92,0 92,12 0,58" fill="#121212" stroke="#2a2a2a"/><polygon class="tf" style="animation-delay:3.0s" points="-92,0 0,-46 92,0 0,46" fill="#151515" stroke="#3a3a3a"/><polygon points="-58,0 0,-29 58,0 0,29" fill="none" stroke="#2c2c2c"/><path d="M92 0H112" stroke="#555"/><circle cx="112" cy="0" r="2" fill="#aaa"/></g>
<text class="lt" x="282" y="326">Data</text><text class="mn" x="282" y="343">Drift · Supabase · REST</text>
<g transform="translate(170 264)"><polygon points="-92,0 0,46 0,58 -92,12" fill="#0b0b0b" stroke="#2a2a2a"/><polygon points="0,46 92,0 92,12 0,58" fill="#121212" stroke="#2a2a2a"/><polygon class="tf" style="animation-delay:1.5s" points="-92,0 0,-46 92,0 0,46" fill="#151515" stroke="#3a3a3a"/><polygon points="-58,0 0,-29 58,0 0,29" fill="none" stroke="#2c2c2c"/><path d="M92 0H112" stroke="#555"/><circle cx="112" cy="0" r="2" fill="#aaa"/></g>
<text class="lt" x="282" y="262">Domain</text><text class="mn" x="282" y="279">Use cases · Repositories</text>
<g transform="translate(170 200)"><polygon points="-92,0 0,46 0,58 -92,12" fill="#0b0b0b" stroke="#2a2a2a"/><polygon points="0,46 92,0 92,12 0,58" fill="#121212" stroke="#2a2a2a"/><polygon class="tf" style="animation-delay:0.0s" points="-92,0 0,-46 92,0 0,46" fill="#151515" stroke="#3a3a3a"/><polygon points="-58,0 0,-29 58,0 0,29" fill="none" stroke="#2c2c2c"/><path d="M92 0H112" stroke="#555"/><circle cx="112" cy="0" r="2" fill="#aaa"/></g>
<text class="lt" x="282" y="198">Presentation</text><text class="mn" x="282" y="215">Widgets · BLoC</text>
<path d="M170 150V388" stroke="#3a3a3a" stroke-dasharray="2 5"/>
<g class="pd"><circle r="3.5" fill="#fff" filter="url(#gl)"/></g>

<!-- impeller -->
<text class="ti" x="488" y="58">Impeller, locked at 120 FPS</text>
<text class="sb" x="488" y="78">RepaintBoundary on every heavy subtree. No rebuild storms.</text>
<text class="big" x="1152" y="62">0</text><text class="mn" x="1152" y="78" text-anchor="end">jank frames</text>
<path d="M488 112H1152" stroke="#666" stroke-dasharray="4 4"/><text class="mn" x="1152" y="106" text-anchor="end">8.33 ms budget</text>
<path d="M488 176H1152" stroke="#262626"/>
<g clip-path="url(#scc)"><g class="scroll"><path d="M493 176v-38M503 176v-41M513 176v-38M523 176v-38M533 176v-40M543 176v-42M553 176v-30M563 176v-29M573 176v-40M583 176v-39M593 176v-44M603 176v-43M613 176v-29M623 176v-27M633 176v-38M643 176v-33M653 176v-28M663 176v-26M673 176v-41M683 176v-46M693 176v-44M703 176v-25M713 176v-43M723 176v-36M733 176v-38M743 176v-44M753 176v-43M763 176v-44M773 176v-29M783 176v-43M793 176v-38M803 176v-41M813 176v-38M823 176v-38M833 176v-40M843 176v-42M853 176v-30M863 176v-29M873 176v-40M883 176v-39M893 176v-44M903 176v-43M913 176v-29M923 176v-27M933 176v-38M943 176v-33M953 176v-28M963 176v-26M973 176v-41M983 176v-46M993 176v-44M1003 176v-25M1013 176v-43M1023 176v-36M1033 176v-38M1043 176v-44M1053 176v-43M1063 176v-44M1073 176v-29M1083 176v-43M1093 176v-38M1103 176v-41M1113 176v-38M1123 176v-38M1133 176v-40M1143 176v-42M1153 176v-30M1163 176v-29M1173 176v-40M1183 176v-39M1193 176v-44M1203 176v-43M1213 176v-29M1223 176v-27M1233 176v-38M1243 176v-33M1253 176v-28M1263 176v-26M1273 176v-41M1283 176v-46M1293 176v-44M1303 176v-25M1313 176v-43M1323 176v-36M1333 176v-38M1343 176v-44M1353 176v-43M1363 176v-44M1373 176v-29M1383 176v-43M1393 176v-38M1403 176v-41M1413 176v-38M1423 176v-38M1433 176v-40M1443 176v-42M1453 176v-30M1463 176v-29M1473 176v-40M1483 176v-39M1493 176v-44M1503 176v-43M1513 176v-29M1523 176v-27M1533 176v-38M1543 176v-33M1553 176v-28M1563 176v-26M1573 176v-41M1583 176v-46M1593 176v-44M1603 176v-25M1613 176v-43M1623 176v-36M1633 176v-38M1643 176v-44M1653 176v-43M1663 176v-44M1673 176v-29M1683 176v-43" stroke="#d4d4d4" stroke-width="4" stroke-linecap="round" fill="none"/></g></g>
<rect x="488" y="96" width="120" height="90" fill="url(#fl)"/>

<!-- ================= fluid motion & animation ================= -->
<text class="ti" x="488" y="240">Fluid motion &amp; animation</text>
<text class="sb" x="488" y="260">Physics curves, gestural flows &amp; micro-interactions.</text>

<!-- spring curve -->
<g transform="translate(488 284)">
  <path d="M0 90H140" stroke="#262626"/>
  <path d="M0 26H140" stroke="#555" stroke-dasharray="3 4"/>
  <text class="mn" x="0" y="19" style="font-size:8px">1.0</text>
  <path d="M0 90C12 90 20 12 40 12C56 12 58 35 74 35C88 35 90 23 104 23C114 23 118 26 140 26" fill="none" stroke="#2a2a2a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M0 90C12 90 20 12 40 12C56 12 58 35 74 35C88 35 90 23 104 23C114 23 118 26 140 26" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100">
    <animate attributeName="stroke-dasharray" values="0 100;100 100;100 100" keyTimes="0;.55;1" calcMode="spline" keySplines=".2 .6 .4 1;0 0 1 1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;.88;1" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle r="4.5" fill="#fff" filter="url(#gl)" opacity="0">
    <animateMotion dur="4s" repeatCount="indefinite" path="M0 90C12 90 20 12 40 12C56 12 58 35 74 35C88 35 90 23 104 23C114 23 118 26 140 26" calcMode="spline" keyPoints="0;1;1" keyTimes="0;.55;1" keySplines=".2 .6 .4 1;0 0 1 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.03;.88;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- motion mini-demos -->
<!-- spring press -->
