<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52525b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#52525b" stop-opacity="1"/>
      <stop offset="1" stop-color="#52525b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fafafa" stop-opacity="1"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="m"><rect width="1000" height="28" fill="url(#edge)"/></mask>
  </defs>
  <rect x="0" y="13.5" width="1000" height="1" fill="url(#line)"/>
  <g mask="url(#m)">
    <rect y="12.5" width="220" height="3" fill="url(#glint)">
      <animate attributeName="x" values="-220;1000" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(500 14)">
    <rect x="-5" y="-5" width="10" height="10" fill="#09090b" stroke="#fafafa" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle r="2" fill="#fafafa">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
