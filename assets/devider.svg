<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="32" viewBox="0 0 1000 32" role="presentation">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#171717" stop-opacity="0"/>
      <stop offset="25%" stop-color="#262626" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#525252" stop-opacity="1"/>
      <stop offset="75%" stop-color="#262626" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#171717" stop-opacity="0"/>
    </linearGradient>

    <!-- Animated Platinum Shimmer Beam -->
    <linearGradient id="glintBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="edgeMask">
      <rect width="1000" height="32" fill="url(#lineGrad)"/>
    </mask>
  </defs>

  <!-- Base Line -->
  <rect x="0" y="15" width="1000" height="1.5" fill="url(#lineGrad)"/>

  <!-- Travelling Light Glint -->
  <g mask="url(#edgeMask)">
    <rect y="14" width="240" height="3.5" fill="url(#glintBeam)">
      <animate attributeName="x" values="-240;1000" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Central Ambient Shuriken Diamond -->
  <g transform="translate(500 16)">
    <!-- Rotating diamond badge -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#0a0a0a" stroke="#fafafa" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="10s" repeatCount="indefinite"/>
    </rect>
    <!-- Center glowing pulse dot (Pure White) -->
    <circle r="2" fill="#fafafa">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
