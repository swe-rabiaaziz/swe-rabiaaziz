<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="114" viewBox="0 0 1000 114" role="img" aria-label="Tech stack: Flutter, Dart, CivicCoach, Zemen, ZenPeace, Health Tracker, Supabase, Firebase, Drift, SQLite, BLoC, Provider, AI Voice">
  <defs>
    <clipPath id="marqueeClip"><rect x="1" y="1" width="998" height="112" rx="18"/></clipPath>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
    <style>
      .chip { fill: #121212; stroke: #262626; stroke-width: 0.8; }
      .chip-highlight { fill: #171717; stroke: #fafafa; stroke-width: 0.8; }
      .t { font: 600 12.5px 'JetBrains Mono', monospace; fill: #a3a3a3; letter-spacing: 0.5px; }
      .t-hl { font: 700 12.5px 'JetBrains Mono', monospace; fill: #fafafa; letter-spacing: 0.5px; }
      .dot { fill: #fafafa; opacity: 0.85; }
      .dot-dim { fill: #737373; opacity: 0.6; }
    </style>

    <!-- Row 1 Items (Width: 2060 total) -->
    <g id="row1">
      <g transform="translate(0, 0)"><rect class="chip-highlight" width="190" height="36" rx="18"/><circle class="dot" cx="20" cy="18" r="3"/><text class="t-hl" x="36" y="22.5">CivicCoach AI</text></g>
      <g transform="translate(206, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Flutter Mobile</text></g>
      <g transform="translate(412, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Dart Language</text></g>
      <g transform="translate(618, 0)"><rect class="chip-highlight" width="190" height="36" rx="18"/><circle class="dot" cx="20" cy="18" r="3"/><text class="t-hl" x="36" y="22.5">Zemen Calendar</text></g>
      <g transform="translate(824, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Supabase Auth</text></g>
      <g transform="translate(1030, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Firebase Cloud</text></g>
      <g transform="translate(1236, 0)"><rect class="chip-highlight" width="190" height="36" rx="18"/><circle class="dot" cx="20" cy="18" r="3"/><text class="t-hl" x="36" y="22.5">ZenPeace Focus</text></g>
      <g transform="translate(1442, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Drift ORM</text></g>
      <g transform="translate(1648, 0)"><rect class="chip-highlight" width="190" height="36" rx="18"/><circle class="dot" cx="20" cy="18" r="3"/><text class="t-hl" x="36" y="22.5">Health Tracker</text></g>
      <g transform="translate(1854, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">SQLite Private</text></g>
    </g>

    <!-- Row 2 Items (Width: 2060 total) -->
    <g id="row2">
      <g transform="translate(0, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Clean Architecture</text></g>
      <g transform="translate(206, 0)"><rect class="chip-highlight" width="190" height="36" rx="18"/><circle class="dot" cx="20" cy="18" r="3"/><text class="t-hl" x="36" y="22.5">Speech-to-Text</text></g>
      <g transform="translate(412, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">BLoC / Cubit</text></g>
      <g transform="translate(618, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">120 FPS Impeller</text></g>
      <g transform="translate(824, 0)"><rect class="chip-highlight" width="190" height="36" rx="18"/><circle class="dot" cx="20" cy="18" r="3"/><text class="t-hl" x="36" y="22.5">Groq LLM Stream</text></g>
      <g transform="translate(1030, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Google ML Kit</text></g>
      <g transform="translate(1236, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Provider State</text></g>
      <g transform="translate(1442, 0)"><rect class="chip-highlight" width="190" height="36" rx="18"/><circle class="dot" cx="20" cy="18" r="3"/><text class="t-hl" x="36" y="22.5">Google Gemini API</text></g>
      <g transform="translate(1648, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Figma to Flutter</text></g>
      <g transform="translate(1854, 0)"><rect class="chip" width="190" height="36" rx="18"/><circle class="dot-dim" cx="20" cy="18" r="3"/><text class="t" x="36" y="22.5">Cross-Platform</text></g>
    </g>
  </defs>

  <rect x="0.75" y="0.75" width="998.5" height="112.5" rx="18" fill="#0a0a0a" stroke="#262626" stroke-width="1.2"/>

  <g clip-path="url(#marqueeClip)">
    <!-- Row 1: Leftward Scroll -->
    <g transform="translate(0, 14)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-2060 0" dur="36s" repeatCount="indefinite"/>
        <use href="#row1" x="0"/>
        <use href="#row1" x="2060"/>
      </g>
    </g>

    <!-- Row 2: Rightward Scroll -->
    <g transform="translate(0, 64)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="-2060 0" to="0 0" dur="42s" repeatCount="indefinite"/>
        <use href="#row2" x="0"/>
        <use href="#row2" x="2060"/>
      </g>
    </g>

    <!-- Soft Vignette Fades on Edges -->
    <rect x="0" y="0" width="120" height="114" fill="url(#fadeLeft)"/>
    <rect x="880" y="0" width="120" height="114" fill="url(#fadeRight)"/>
  </g>
</svg>
